<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utpal Kant Sharma — AI Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- Three.js is pulled straight from a CDN as ES modules so this stays a
     plain static site — no npm, no bundler. The import map is what lets
     cinematic-scene.js write `import ... from 'three'` in the browser. -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="bg-drift"></div>
<div class="bg-radial"></div>

<!-- ===== CINEMATIC 3D INTRO (Phases 1-3 of 6) =====
     A real Three.js environment, taking over the slot the CSS-drawn
     #roomScene used to hold: the studio room, and a camera that walks from a
     wide establishing shot to a close-up of the laptop's keyboard as you
     scroll. All of the WebGL lives in cinematic-scene.js — script.js is
     untouched.

     #cineIntro is its own scroll container rather than the page being one,
     because <body> is overflow:hidden for the chat UI underneath. The tall
     #cineScrollTrack is the camera's timeline and holds nothing but the
     canvas, which sticks to the top of it while the track scrolls past. -->
<div id="cineIntro" aria-hidden="true">
  <div id="cineScrollTrack">
    <canvas id="cineCanvas"></canvas>
  </div>

  <!-- Fixed, so it sits still while the track moves behind it. Fades out on
       the first flick of the wheel; without it the intro looks like a static
       render with no way in. -->
  <div id="cineScrollCue">
    <span class="cine-cue-label">Scroll</span>
    <span class="cine-cue-line"></span>
  </div>
</div>

<!-- ===== SCREEN UI (CSS3D) =====
     The chat UI's only home: the laptop's screen in the room above. There
     is no second laptop drawn in CSS — #cineUI is the layer cinematic-scene.js
     hands to a CSS3DRenderer, a full-viewport div laid exactly over
     #cineCanvas and drawn from the same camera, and #screenUI is the element
     it wraps in a CSS3DObject and pins to the panel's front face: position,
     rotation and size are all measured off the screen mesh, so the live
     interface sits on that surface and moves with the room. #screenUIFit is
     the scale wrapper: the chat UI is laid out at its desktop design width
     inside it and drawn down to the panel's box (see SCREEN UI in style.css
     and SCREEN_UI in cinematic-scene.js), so type stays legible once the lens
     is in. The module moves #screenUI into the renderer's own camera element
     on its first frame; until then it sits here, dark, behind the intro.
     Everything inside <main class="stage"> is untouched, and script.js knows
     nothing about any of this. -->
<div id="cineUI">
  <div id="screenUI">
    <div id="screenUIFit">
<main class="stage" id="stage">
  <section class="shell">
    <div class="corner-glow"></div>

    <header class="topbar">
      <div class="logo">➚</div>

      <nav class="tabs" id="tabs"></nav>

      <div class="top-actions">
        <div class="theme-toggle">
          <span class="theme-icon">☀</span>
          <span class="theme-icon active">☾</span>
        </div>
        <a href="mailto:utpalksharma156@gmail.com" class="icon-btn" title="Email Utpal">✉</a>
        <a href="https://github.com/utpalks34" target="_blank" rel="noopener" class="icon-btn" title="GitHub">⌂</a>
        <div class="avatar">UK</div>
      </div>
    </header>

    <div class="body-row">
      <div class="rail" id="rail">
        <div class="rail-bottom">
          <button class="rail-btn danger" id="railClear" title="Clear chat">⌫</button>
          <a href="mailto:utpalksharma156@gmail.com" class="rail-btn" title="Hire Utpal">➜</a>
        </div>
      </div>

      <div class="chat-panel">
        <div class="chat-header">
          <div class="assistant-badge">
            <span class="pulse-dot"></span>
            <span>Utpal's AI Assistant</span>
          </div>
          <button class="icon-btn round mobile-only" id="historyToggle" title="History">↺</button>
          <button class="icon-btn round" id="chatMenu" title="Clear chat">⋮</button>
        </div>

        <div class="messages" id="messagesScroll">
          <div class="empty-state" id="emptyState">
            <div class="orb">
              <span class="orb-glow"></span>
              <span class="orb-ring1"></span>
              <span class="orb-ring2"></span>
              <span class="orb-core"></span>
            </div>
            <div class="empty-title">Ask me anything<br>about Utpal</div>
          </div>
          <div class="message-list" id="messageList"></div>
        </div>

        <div class="composer">
          <div class="composer-box">
            <div class="composer-input-row">
              <span class="composer-icon">✦</span>
              <input id="draftInput" type="text" autocomplete="off" placeholder="Ask me anything about Utpal — projects, stack, experience…">
            </div>
            <div class="composer-actions">
              <div class="chips" id="chips"></div>
              <div class="composer-buttons">
                <button class="icon-btn round" id="composerClear" title="Clear chat">⌫</button>
                <button class="send-btn" id="sendBtn" title="Send">➤</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <aside class="history-panel" id="historyPanel">
        <button class="icon-btn round history-close-btn mobile-only" id="historyClose" title="Close">✕</button>
        <div class="history-header">
          <span class="history-title">History Chat</span>
          <button class="new-chat-btn" id="newChatBtn"><span class="plus">＋</span>New Chat</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </aside>

      <div class="history-backdrop" id="historyBackdrop"></div>
    </div>
  </section>
</main>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script type="module" src="cinematic-scene.js"></script>
</body>
</html>
